services:
  postgres:
    image: postgres:16-alpine
    container_name: dev_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_Username}
      POSTGRES_PASSWORD: ${DB_Password}
      POSTGRES_DB: ${DB_NameDatabase}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: my-redis
    ports:
        - '6379:6379'
    volumes:
        - redis-data:/data
    command: redis-server --requirepass your_password_here --appendonly yes
    restart: unless-stopped
  api: 
    build: .
    container_name: dev_api
    ports:
    - "8000:8000"
    depends_on:
    - "postgres"
    - "redis"
  webapp:
    environment:
      enc_file: 
        -.env 
    

volumes:
  pgdata:
  redis-data:
        driver: local